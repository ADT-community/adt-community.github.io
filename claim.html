<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim a task · ADT Work</title>
<link rel="stylesheet" href="style.css">
<style>
  form { display: grid; gap: 16px; max-width: 560px; margin-top: 20px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
  label small { font-weight: 400; color: var(--muted); }
  input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .phone { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
  .check input { margin-top: 4px; }
  .err { color: #b3261e; font-size: 14px; min-height: 1em; }
  .ok { border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html">ADT Community</a>
  <ul><li><a href="work.html">Work</a></li><li><a href="index.html#projects">Projects</a></li></ul>
</div></nav>

<section><div class="wrap">
  <p class="kicker">ADT Work</p>
  <h1 style="font-size:clamp(26px,5vw,40px)">Claim a task</h1>
  <p class="lead" id="for">ADT Work creates jobs for people living in Africa. You need an African phone number to claim.</p>

  <form id="claim" novalidate>
    <input type="hidden" name="type" value="claim">
    <label>Task
      <select name="task" id="task" required></select>
    </label>
    <label>Full name
      <input name="name" autocomplete="name" required>
    </label>
    <label>Phone number <small>African numbers only. We confirm it by SMS or WhatsApp before assigning you.</small>
      <div class="phone">
        <select id="code" aria-label="Country code" required></select>
        <input id="local" inputmode="tel" autocomplete="tel-national" placeholder="e.g. 0801 234 5678" aria-label="Phone number" required>
      </div>
    </label>
    <label>City
      <input name="city" autocomplete="address-level2" required>
    </label>
    <label>Email <small>Optional</small>
      <input name="email" type="email" autocomplete="email">
    </label>
    <label>Your experience with this kind of work <small>2 or 3 sentences</small>
      <textarea name="experience" rows="3" required></textarea>
    </label>
    <label>Portfolio or past work <small>A link: Figma, Behance, GitHub, a doc, a website</small>
      <input name="portfolio" type="url" placeholder="https://">
    </label>
    <label>GitHub username <small>Only needed for code tasks, so we can give you access</small>
      <input name="github" autocomplete="username">
    </label>
    <label class="check"><input type="checkbox" name="lives_in_africa" value="yes" required>
      <span>I live in Africa, and I'll receive payouts to an African mobile money or bank account.</span></label>
    <label class="check"><input type="checkbox" name="agrees_rules" value="yes" required>
      <span>I'll share progress within 5 days and deliver within 14 days, or release the task. Only approved work is paid.</span></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" type="submit">Claim task</button>
  </form>
  <div id="done" hidden></div>
</div></section>

<script src="adt.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  const sel = document.getElementById("task");
  adtPhoneSelect(document.getElementById("code"));
  try {
    const tasks = (await adtLoadTasks()).filter(t => t.status === "open");
    sel.innerHTML = '<option value="">Choose a task</option>' + tasks.map(t =>
      `<option value="${adtEsc(t.id)}">${adtEsc(t.title)} (${t.paid ? "$" + t.reward : "next wave"})</option>`).join("");
    if (id) sel.value = id;
  } catch (e) { sel.innerHTML = '<option value="">Couldn\'t load tasks</option>'; }

  document.getElementById("claim").addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = ev.target, err = document.getElementById("err");
    err.textContent = "";
    const phone = adtValidPhone(document.getElementById("code").value, document.getElementById("local").value);
    if (!sel.value) return (err.textContent = "Choose a task.");
    if (!phone) return (err.textContent = "Enter an African phone number: pick your country, then your number.");
    if (!f.checkValidity()) return (err.textContent = "Please fill in every required field and tick both boxes.");
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Sending…";
    try {
      const r = await adtSend(f, { phone, task_title: sel.options[sel.selectedIndex].text, page: location.href });
      const done = document.getElementById("done");
      if (r.notReady) {
        err.textContent = "Claims open very soon. Please check back in a few days.";
        btn.disabled = false; btn.textContent = "Claim task"; return;
      }
      if (!r.ok) throw new Error();
      f.hidden = true; done.hidden = false;
      done.innerHTML = `<div class="ok"><h3>Claim received</h3><p>We'll message ${adtEsc(phone)} to confirm your number and assign you, usually within 2 days. Don't start until you're assigned, so nobody duplicates work.</p><p><a href="work.html">Back to tasks</a></p></div>`;
    } catch (e) {
      err.textContent = "Couldn't send your claim. Check your connection and try again.";
      btn.disabled = false; btn.textContent = "Claim task";
    }
  });
})();
</script>
</body>
</html>
