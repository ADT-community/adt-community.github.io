<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliver work · ADT Work</title>
<link rel="stylesheet" href="style.css">
<style>
  form { display: grid; gap: 16px; max-width: 560px; margin-top: 20px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
  label small { font-weight: 400; color: var(--muted); }
  input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .phone { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; }
  .err { color: #b3261e; font-size: 14px; min-height: 1em; }
  .ok { border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html">ADT Community</a>
  <ul><li><a href="work.html">Work</a></li><li><a href="index.html#projects">Projects</a></li></ul>
</div></nav>

<section><div class="wrap">
  <p class="kicker">ADT Work</p>
  <h1 style="font-size:clamp(26px,5vw,40px)">Deliver your work</h1>
  <p class="lead">Send this when your task is finished, or to share progress. A reviewer checks it against the task's "Done when" list.</p>

  <form id="submit" novalidate>
    <input type="hidden" name="type" value="delivery">
    <label>Task <select name="task" id="task" required></select></label>
    <label>Phone number you claimed with
      <div class="phone">
        <select id="code" aria-label="Country code" required></select>
        <input id="local" inputmode="tel" placeholder="e.g. 0801 234 5678" aria-label="Phone number" required>
      </div>
    </label>
    <label>Is this the final delivery?
      <select name="stage" required>
        <option value="final">Yes, it's finished</option>
        <option value="progress">No, a progress update</option>
      </select>
    </label>
    <label>Link to your work <small>Figma file, pull request, document or folder. Make sure we can open it.</small>
      <input name="work_link" type="url" placeholder="https://" required>
    </label>
    <label>Other links <small>Optional: screenshots, video, extra files</small>
      <textarea name="other_links" rows="2"></textarea>
    </label>
    <label>Notes for the reviewer <small>What you did, anything unfinished, decisions you made</small>
      <textarea name="notes" rows="4" required></textarea>
    </label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" type="submit">Send</button>
  </form>
  <div id="done" hidden></div>
</div></section>

<script src="adt.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  const sel = document.getElementById("task");
  adtPhoneSelect(document.getElementById("code"));
  try {
    const tasks = await adtLoadTasks();
    sel.innerHTML = '<option value="">Choose your task</option>' + tasks.map(t =>
      `<option value="${adtEsc(t.id)}">${adtEsc(t.title)}</option>`).join("");
    if (id) sel.value = id;
  } catch (e) { sel.innerHTML = '<option value="">Couldn\'t load tasks</option>'; }

  document.getElementById("submit").addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = ev.target, err = document.getElementById("err");
    err.textContent = "";
    const phone = adtValidPhone(document.getElementById("code").value, document.getElementById("local").value);
    if (!sel.value) return (err.textContent = "Choose your task.");
    if (!phone) return (err.textContent = "Enter the African phone number you claimed with.");
    if (!f.checkValidity()) return (err.textContent = "Please add a valid link to your work and a short note.");
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Sending…";
    try {
      const r = await adtSend(f, { phone, task_title: sel.options[sel.selectedIndex].text });
      if (r.notReady) { err.textContent = "Deliveries open very soon."; btn.disabled = false; btn.textContent = "Send"; return; }
      if (!r.ok) throw new Error();
      f.hidden = true;
      const done = document.getElementById("done"); done.hidden = false;
      done.innerHTML = '<div class="ok"><h3>Received</h3><p>A reviewer will check it within 3 days and message you. Approved work is paid in the next weekly payout run.</p><p><a href="work.html">Back to tasks</a></p></div>';
    } catch (e) {
      err.textContent = "Couldn't send. Check your connection and try again.";
      btn.disabled = false; btn.textContent = "Send";
    }
  });
})();
</script>
</body>
</html>
